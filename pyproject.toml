[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h2_bottleneck"
version = "0.1.0"
description = "Nodal model of hydrogen injection/withdrawal limits for depleted gas field storage (Rough case study)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
